# =========================================================
# InterviewOS — Spring Boot Configuration
# Copy this to application-local.properties for local dev
# All secrets should be injected via environment variables
# =========================================================

spring.application.name=interviewos

# MongoDB (replaces MONGO_URI in .env)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/interviewos}

# JWT (replaces JWT_SECRET in .env)
app.jwt.secret=${JWT_SECRET:change-me-in-production-use-a-256-bit-key}
app.jwt.expiration-ms=86400000

# Mail (replaces nodemailer config)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=${PORT:5000}

# CORS — set to your frontend URL in prod
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:3000}

# Code sandbox timeout (ms)
app.judge.timeout-ms=5000
app.judge.use-docker=${USE_DOCKER_SANDBOX:false}

# Actuator — health endpoint for uptime monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.interviewos=DEBUG
logging.level.org.springframework.security=WARN

# Email verification
app.email-verification.required=${EMAIL_VERIFICATION_REQUIRED:false}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
